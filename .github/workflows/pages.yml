name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One concurrent deploy; queued runs supersede each other rather than racing.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - name: Resolve the Pages base path
        id: pages
        uses: actions/configure-pages@v5

      - name: Build static export
        # A project site is served from /<repo>, so that prefix has to be baked
        # into every asset URL and link. configure-pages reports it as
        # base_path, and it is empty once a custom domain is attached.
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build:pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
